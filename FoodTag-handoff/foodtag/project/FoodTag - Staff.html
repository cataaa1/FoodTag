<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodTag — Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0F0F0F;
  --bg2: #1A1A1A;
  --bg3: #242424;
  --card: #1E1E1E;
  --border: #2E2E2E;
  --text: #F5F5F5;
  --text2: #A0A0A0;
  --text3: #606060;
  --orange: #F97316;
  --orange-dim: rgba(249,115,22,0.15);
  --red: #EF4444;
  --green: #22C55E;
  --yellow: #EAB308;
  --blue: #3B82F6;
  --radius: 12px;
}
body { font-family: 'DM Sans', sans-serif; background: #000; color: var(--text); min-height: 100vh; }
button { cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; outline: none; }
input { font-family: 'DM Sans', sans-serif; }
.scrollable::-webkit-scrollbar { width: 4px; height: 4px; }
.scrollable::-webkit-scrollbar-track { background: transparent; }
.scrollable::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

.dev-nav {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; background: rgba(0,0,0,0.9); padding: 8px 12px;
  border-radius: 999px; z-index: 1000; border: 1px solid var(--border);
}
.dev-nav button {
  background: rgba(255,255,255,0.08); color: var(--text2); font-size: 11px;
  font-weight: 600; padding: 5px 12px; border-radius: 999px; letter-spacing: 0.3px;
  transition: background 0.15s; white-space: nowrap;
}
.dev-nav button:hover { background: rgba(255,255,255,0.15); }
.dev-nav button.active { background: var(--orange); color: white; }

.tweaks-panel {
  position: fixed; bottom: 60px; right: 16px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  padding: 16px; width: 220px; z-index: 999; display: none;
}
.tweaks-panel.open { display: block; }
.tweaks-panel h3 { font-size: 12px; font-weight: 700; margin-bottom: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
.tweak-row { margin-bottom: 10px; }
.tweak-row label { font-size: 11px; font-weight: 600; color: var(--text3); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.tweak-row select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; font-family: 'DM Sans'; background: var(--bg3); color: var(--text); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "layout": "desktop",
  "columnStyle": "default",
  "cardDensity": "normal"
}/*EDITMODE-END*/;

// ── MOCK DATA ──────────────────────────────────────────────
const INITIAL_ORDERS = [
  { id:1, ticket:"#031", name:"Valentina", items:[{q:2,n:"Classic Smash",note:"sin pickles"},{q:1,n:"Papas Cheddar",note:""}], total:7200, tip:720, time:"20:14", status:"pending", badge:"mod", phone:"1134567890" },
  { id:2, ticket:"#032", name:"Matías",    items:[{q:1,n:"Crispy Chicken",note:""},{q:2,n:"Gaseosa",note:""}], total:4000, tip:400, time:"20:17", status:"pending", badge:null, phone:"1145678901" },
  { id:3, ticket:"#033", name:"Lucía",     items:[{q:1,n:"BBQ Bacon",note:"bien cocida"},{q:1,n:"Papas Fritas",note:""}], total:4400, tip:0,   time:"20:18", status:"preparing", badge:"unseen", phone:"1156789012" },
  { id:4, ticket:"#034", name:"Tomás",     items:[{q:3,n:"Classic Smash (Doble)",note:""},{q:1,n:"Brownie",note:""}], total:12200,tip:1220,time:"20:10", status:"preparing", badge:null, phone:"1167890123" },
  { id:5, ticket:"#035", name:"Camila",    items:[{q:1,n:"Alfajor artesanal",note:""},{q:1,n:"Agua con gas",note:""}], total:1500, tip:150, time:"20:09", status:"done", badge:null, phone:"1178901234" },
  { id:6, ticket:"#036", name:"Facundo",   items:[{q:2,n:"Classic Smash",note:""},{q:2,n:"Papas Fritas",note:""}], total:8000, tip:800, time:"20:11", status:"done", badge:"unseen", phone:"1189012345" },
];

function fmt(n) { return "$" + n.toLocaleString("es-AR"); }
function timeSince(t) {
  const [h,m] = t.split(":").map(Number);
  const now = new Date();
  const diff = (now.getHours()*60+now.getMinutes()) - (h*60+m);
  if (diff < 1) return "hace un momento";
  if (diff < 60) return `hace ${diff} min`;
  return `hace ${Math.floor(diff/60)}h`;
}

// ── BADGE ──────────────────────────────────────────────────
function Badge({type}) {
  const map = {
    mod:   { label:"Modificación", color:"#EAB308", bg:"rgba(234,179,8,0.15)" },
    unseen:{ label:"No vio aviso", color:"#EF4444", bg:"rgba(239,68,68,0.15)" },
  };
  const b = map[type];
  if (!b) return null;
  return <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:6,background:b.bg,color:b.color,letterSpacing:0.3}}>{b.label}</span>;
}

// ── ORDER CARD ─────────────────────────────────────────────
function OrderCard({ order, onClick, mobile }) {
  const statusColor = { pending:"#A0A0A0", preparing:"#EAB308", done:"#22C55E" };
  return (
    <div onClick={() => onClick(order)} style={{
      background:"var(--card)", borderRadius:"var(--radius)",
      padding: mobile ? "14px" : "16px",
      border:`1px solid var(--border)`, cursor:"pointer",
      transition:"border 0.15s, transform 0.1s",
      marginBottom: mobile ? 10 : 0,
    }}
    onMouseEnter={e => { e.currentTarget.style.border="1px solid "+statusColor[order.status]; e.currentTarget.style.transform="translateY(-1px)"; }}
    onMouseLeave={e => { e.currentTarget.style.border="1px solid var(--border)"; e.currentTarget.style.transform=""; }}
    >
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
        <div style={{fontFamily:"DM Mono, monospace",fontSize:28,fontWeight:700,color:"var(--text)",letterSpacing:"-1px",lineHeight:1}}>{order.ticket}</div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
          <span style={{fontSize:11,color:"var(--text3)",fontWeight:500}}>{timeSince(order.time)}</span>
          {order.badge && <Badge type={order.badge}/>}
        </div>
      </div>
      <div style={{fontSize:13,fontWeight:700,color:"var(--text)",marginBottom:4}}>{order.name}</div>
      <div style={{fontSize:12,color:"var(--text2)",marginBottom:10,lineHeight:1.5}}>
        {order.items.map(i => `${i.q}× ${i.n}`).join(" · ")}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:14,fontWeight:700,color:"var(--orange)"}}>{fmt(order.total)}</span>
        <span style={{fontSize:11,color:"var(--text3)",fontWeight:500}}>{order.items.reduce((s,i)=>s+i.q,0)} ítems</span>
      </div>
      {mobile && (
        <div style={{marginTop:12,display:"flex",gap:8}}>
          {order.status === "pending" && <button onClick={e=>{e.stopPropagation();}} style={{flex:1,padding:"10px",background:"var(--orange)",color:"white",borderRadius:10,fontWeight:700,fontSize:13}}>→ Preparando</button>}
          {order.status === "preparing" && <button onClick={e=>{e.stopPropagation();}} style={{flex:1,padding:"10px",background:"var(--green)",color:"white",borderRadius:10,fontWeight:700,fontSize:13}}>✓ Listo</button>}
          {order.status === "done" && <button onClick={e=>{e.stopPropagation();}} style={{flex:1,padding:"10px",background:"var(--bg3)",color:"var(--text2)",borderRadius:10,fontWeight:600,fontSize:13}}>🔔 Re-llamar</button>}
        </div>
      )}
    </div>
  );
}

// ── ORDER DETAIL MODAL ─────────────────────────────────────
function OrderDetail({ order, onClose, onAdvance, onBell }) {
  if (!order) return null;
  const statusLabel = { pending:"Pendiente", preparing:"En preparación", done:"Listo" };
  const nextLabel = { pending:"→ Pasar a Preparación", preparing:"✓ Marcar como Listo" };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:24}} onClick={onClose}>
      <div style={{background:"var(--bg2)",borderRadius:20,width:"100%",maxWidth:440,padding:28,border:"1px solid var(--border)",boxShadow:"0 20px 60px rgba(0,0,0,0.6)"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontFamily:"DM Mono, monospace",fontSize:36,fontWeight:700,color:"var(--text)"}}>{order.ticket}</span>
            {order.badge && <Badge type={order.badge}/>}
          </div>
          <button onClick={onClose} style={{width:32,height:32,borderRadius:8,background:"var(--bg3)",color:"var(--text2)",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
        </div>

        {/* Cliente */}
        <div style={{background:"var(--bg3)",borderRadius:12,padding:"12px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:13,color:"var(--text3)",marginBottom:2}}>Cliente</div>
            <div style={{fontSize:15,fontWeight:700,color:"var(--text)"}}>{order.name}</div>
            <div style={{fontSize:12,color:"var(--text2)"}}>+54 9 {order.phone.slice(0,2)} {order.phone.slice(2,6)}-{order.phone.slice(6)}</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button style={{width:40,height:40,borderRadius:10,background:"rgba(34,197,94,0.15)",color:"#22C55E",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>📞</button>
            <button style={{width:40,height:40,borderRadius:10,background:"rgba(59,130,246,0.15)",color:"#3B82F6",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>💬</button>
          </div>
        </div>

        {/* Items */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:700,color:"var(--text3)",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Detalle del pedido</div>
          {order.items.map((item, i) => (
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
              <div>
                <div style={{fontSize:14,fontWeight:600,color:"var(--text)"}}>{item.q}× {item.n}</div>
                {item.note && <div style={{fontSize:12,color:"var(--yellow)",marginTop:2}}>⚠ {item.note}</div>}
              </div>
            </div>
          ))}
        </div>

        {/* Totals */}
        <div style={{background:"var(--bg3)",borderRadius:12,padding:"12px 16px",marginBottom:20}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"var(--text2)",marginBottom:4}}><span>Subtotal</span><span>{fmt(order.total)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"var(--text2)",marginBottom:8}}><span>Propina</span><span>{fmt(order.tip)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:16,fontWeight:800,color:"var(--text)"}}><span>Total</span><span>{fmt(order.total + order.tip)}</span></div>
        </div>

        {/* Actions */}
        <div style={{display:"flex",gap:10}}>
          {order.status !== "done" && nextLabel[order.status] && (
            <button onClick={() => onAdvance(order)} style={{flex:2,padding:"14px",background:"var(--orange)",color:"white",borderRadius:12,fontWeight:700,fontSize:14}}>
              {nextLabel[order.status]}
            </button>
          )}
          {order.status === "done" && (
            <button onClick={() => onBell(order)} style={{flex:2,padding:"14px",background:"rgba(249,115,22,0.15)",color:"var(--orange)",borderRadius:12,fontWeight:700,fontSize:14,border:"1px solid rgba(249,115,22,0.3)"}}>
              🔔 Re-llamar al cliente
            </button>
          )}
          <button style={{flex:1,padding:"14px",background:"rgba(239,68,68,0.1)",color:"#EF4444",borderRadius:12,fontWeight:600,fontSize:13,border:"1px solid rgba(239,68,68,0.2)"}}>
            Cancelar
          </button>
        </div>
        {order.badge === "mod" && (
          <button style={{width:"100%",marginTop:10,padding:"12px",background:"rgba(234,179,8,0.12)",color:"var(--yellow)",borderRadius:12,fontWeight:600,fontSize:13,border:"1px solid rgba(234,179,8,0.25)"}}>
            ✓ Aprobar modificación de cliente
          </button>
        )}
      </div>
    </div>
  );
}

// ── LOGIN ──────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState("cocina@foodtag.ar");
  const [pass, setPass] = useState("••••••••");
  const [loading, setLoading] = useState(false);

  function submit(e) {
    e.preventDefault();
    setLoading(true);
    setTimeout(() => { setLoading(false); onLogin(); }, 900);
  }

  const inputStyle = {
    width:"100%", padding:"14px 16px", fontSize:15, fontWeight:500,
    borderRadius:10, border:"1.5px solid var(--border)",
    background:"var(--bg3)", color:"var(--text)", outline:"none",
    transition:"border 0.2s",
  };

  return (
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{width:"100%",maxWidth:380}}>
        <div style={{textAlign:"center",marginBottom:36}}>
          <div style={{width:64,height:64,background:"var(--orange)",borderRadius:18,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",fontSize:30,boxShadow:"0 4px 24px rgba(249,115,22,0.3)"}}>🚚</div>
          <div style={{fontSize:24,fontWeight:800,color:"var(--text)",letterSpacing:"-0.5px"}}>FoodTag Staff</div>
          <div style={{fontSize:13,color:"var(--text3)",marginTop:4}}>Panel de operaciones</div>
        </div>
        <form onSubmit={submit} style={{display:"flex",flexDirection:"column",gap:14}}>
          <div>
            <label style={{fontSize:12,fontWeight:700,color:"var(--text2)",display:"block",marginBottom:6,textTransform:"uppercase",letterSpacing:0.5}}>Email</label>
            <input style={inputStyle} value={email} onChange={e=>setEmail(e.target.value)} type="email" autoComplete="email"
              onFocus={e=>e.target.style.border="1.5px solid var(--orange)"}
              onBlur={e=>e.target.style.border="1.5px solid var(--border)"}
            />
          </div>
          <div>
            <label style={{fontSize:12,fontWeight:700,color:"var(--text2)",display:"block",marginBottom:6,textTransform:"uppercase",letterSpacing:0.5}}>Contraseña</label>
            <input style={inputStyle} value={pass} onChange={e=>setPass(e.target.value)} type="password" autoComplete="current-password"
              onFocus={e=>e.target.style.border="1.5px solid var(--orange)"}
              onBlur={e=>e.target.style.border="1.5px solid var(--border)"}
            />
          </div>
          <button type="submit" disabled={loading} style={{
            marginTop:8,background:"var(--orange)",color:"white",
            fontSize:16,fontWeight:700,padding:"15px",borderRadius:12,
            opacity:loading?0.7:1,transition:"opacity 0.2s",
            boxShadow:"0 4px 20px rgba(249,115,22,0.3)"
          }}>{loading ? "Entrando…" : "Entrar al panel"}</button>
        </form>
        <div style={{marginTop:20,textAlign:"center",fontSize:12,color:"var(--text3)"}}>
          ¿Olvidaste la contraseña? <span style={{color:"var(--orange)",cursor:"pointer",fontWeight:600}}>Contactá al admin</span>
        </div>
      </div>
    </div>
  );
}

// ── KANBAN DESKTOP ─────────────────────────────────────────
function KanbanDesktop({ orders, setOrders, onOpenDetail }) {
  const cols = [
    { id:"pending",    label:"Pendiente",      color:"#A0A0A0", dot:"#A0A0A0" },
    { id:"preparing",  label:"En preparación", color:"#EAB308", dot:"#EAB308" },
    { id:"done",       label:"Listo",          color:"#22C55E", dot:"#22C55E" },
  ];

  function advance(order) {
    const next = { pending:"preparing", preparing:"done" };
    if (!next[order.status]) return;
    setOrders(prev => prev.map(o => o.id===order.id ? {...o, status:next[o.status], badge:null} : o));
  }

  return (
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",flexDirection:"column"}}>
      {/* Header */}
      <div style={{background:"var(--bg2)",borderBottom:"1px solid var(--border)",padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:36,height:36,background:"var(--orange)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🚚</div>
          <div>
            <div style={{fontSize:16,fontWeight:800,color:"var(--text)",letterSpacing:"-0.3px"}}>El Smash del Barrio</div>
            <div style={{fontSize:11,color:"var(--text3)"}}>Hola, <span style={{color:"var(--orange)",fontWeight:600}}>María (Cocina)</span></div>
          </div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          {/* Live indicator */}
          <div style={{display:"flex",alignItems:"center",gap:6,background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.25)",borderRadius:999,padding:"6px 12px"}}>
            <span style={{width:7,height:7,background:"#22C55E",borderRadius:"50%",display:"inline-block",boxShadow:"0 0 0 2px rgba(34,197,94,0.3)",animation:"pulse 2s infinite"}}></span>
            <span style={{fontSize:12,fontWeight:700,color:"#22C55E"}}>En vivo</span>
          </div>
          <button style={{padding:"8px 16px",background:"var(--bg3)",color:"var(--text2)",borderRadius:10,fontWeight:600,fontSize:13,border:"1px solid var(--border)"}}>↻ Actualizar</button>
          <button style={{padding:"8px 16px",background:"transparent",color:"var(--text3)",borderRadius:10,fontWeight:500,fontSize:13,border:"1px solid var(--border)"}}>Salir</button>
        </div>
      </div>

      {/* Kanban columns */}
      <div style={{flex:1,display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,padding:20,overflowY:"auto"}} className="scrollable">
        {cols.map(col => {
          const colOrders = orders.filter(o => o.status === col.id);
          return (
            <div key={col.id} style={{background:"var(--bg2)",borderRadius:16,padding:16,border:"1px solid var(--border)",display:"flex",flexDirection:"column",gap:10}}>
              {/* Col header */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{width:9,height:9,borderRadius:"50%",background:col.dot,display:"inline-block"}}></span>
                  <span style={{fontSize:13,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:0.8}}>{col.label}</span>
                </div>
                <span style={{fontSize:12,fontWeight:700,background:"var(--bg3)",color:"var(--text2)",borderRadius:99,width:24,height:24,display:"flex",alignItems:"center",justifyContent:"center"}}>{colOrders.length}</span>
              </div>
              {/* Cards */}
              {colOrders.length === 0 && (
                <div style={{textAlign:"center",padding:"32px 16px",color:"var(--text3)",fontSize:13}}>Sin pedidos</div>
              )}
              {colOrders.map(order => (
                <div key={order.id}>
                  <OrderCard order={order} onClick={onOpenDetail} mobile={false}/>
                  {col.id === "done" && (
                    <button onClick={()=>{}} style={{width:"100%",marginTop:-4,padding:"8px",background:"rgba(249,115,22,0.08)",color:"var(--orange)",borderRadius:"0 0 10px 10px",fontWeight:600,fontSize:12,border:"1px solid rgba(249,115,22,0.15)",borderTop:"none"}}>
                      🔔 Re-llamar
                    </button>
                  )}
                  {col.id === "pending" && (
                    <button onClick={()=>advance(order)} style={{width:"100%",marginTop:-4,padding:"8px",background:"rgba(249,115,22,0.08)",color:"var(--orange)",borderRadius:"0 0 10px 10px",fontWeight:600,fontSize:12,border:"1px solid rgba(249,115,22,0.15)",borderTop:"none"}}>
                      → Preparación
                    </button>
                  )}
                  {col.id === "preparing" && (
                    <button onClick={()=>advance(order)} style={{width:"100%",marginTop:-4,padding:"8px",background:"rgba(34,197,94,0.08)",color:"var(--green)",borderRadius:"0 0 10px 10px",fontWeight:600,fontSize:12,border:"1px solid rgba(34,197,94,0.15)",borderTop:"none"}}>
                      ✓ Listo
                    </button>
                  )}
                </div>
              ))}
            </div>
          );
        })}
      </div>
      <style>{`@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }`}</style>
    </div>
  );
}

// ── KANBAN MOBILE ──────────────────────────────────────────
function KanbanMobile({ orders, setOrders, onOpenDetail }) {
  const [activeTab, setActiveTab] = useState("pending");
  const tabs = [
    { id:"pending",   label:"Pendiente", color:"#A0A0A0" },
    { id:"preparing", label:"Preparando", color:"#EAB308" },
    { id:"done",      label:"Listo",     color:"#22C55E" },
  ];
  const colOrders = orders.filter(o => o.status === activeTab);

  return (
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",flexDirection:"column"}}>
      {/* Header */}
      <div style={{background:"var(--bg2)",padding:"14px 16px 0",borderBottom:"1px solid var(--border)",flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:17,fontWeight:800,color:"var(--text)"}}>🚚 Kanban</div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{width:8,height:8,background:"#22C55E",borderRadius:"50%",boxShadow:"0 0 0 2px rgba(34,197,94,0.25)"}}></span>
            <span style={{fontSize:12,color:"#22C55E",fontWeight:600}}>En vivo</span>
          </div>
        </div>
        <div style={{display:"flex",gap:4}}>
          {tabs.map(tab => {
            const cnt = orders.filter(o=>o.status===tab.id).length;
            return (
              <button key={tab.id} onClick={()=>setActiveTab(tab.id)} style={{
                flex:1,padding:"10px 6px",borderRadius:"10px 10px 0 0",fontSize:12,fontWeight:700,
                background:activeTab===tab.id ? "var(--bg)" : "transparent",
                color: activeTab===tab.id ? tab.color : "var(--text3)",
                border: activeTab===tab.id ? "1px solid var(--border)" : "none",
                borderBottom: activeTab===tab.id ? "1px solid var(--bg)" : "none",
                position:"relative",
              }}>
                {tab.label}
                {cnt > 0 && <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:18,height:18,borderRadius:"50%",background:tab.color,color:"black",fontSize:10,fontWeight:800,marginLeft:5}}>{cnt}</span>}
              </button>
            );
          })}
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"14px 14px 80px"}} className="scrollable">
        {colOrders.length === 0 && <div style={{textAlign:"center",padding:"40px",color:"var(--text3)",fontSize:14}}>Sin pedidos en esta columna</div>}
        {colOrders.map(order => <OrderCard key={order.id} order={order} onClick={onOpenDetail} mobile={true}/>)}
      </div>
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState(() => localStorage.getItem("ft_staff_screen") || "login");
  const [view, setView] = useState(() => localStorage.getItem("ft_staff_view") || "desktop");
  const [orders, setOrders] = useState(INITIAL_ORDERS);
  const [detail, setDetail] = useState(null);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = useState(false);

  useEffect(() => { localStorage.setItem("ft_staff_screen", screen); }, [screen]);
  useEffect(() => { localStorage.setItem("ft_staff_view", view); }, [view]);

  useEffect(() => {
    window.addEventListener("message", e => {
      if (e.data?.type === "__activate_edit_mode") setShowTweaks(true);
      if (e.data?.type === "__deactivate_edit_mode") setShowTweaks(false);
    });
    window.parent.postMessage({type:"__edit_mode_available"}, "*");
  }, []);

  function advanceOrder(order) {
    const next = { pending:"preparing", preparing:"done" };
    if (!next[order.status]) return;
    setOrders(prev => prev.map(o => o.id===order.id ? {...o, status:next[o.status], badge:null} : o));
    if (detail?.id === order.id) setDetail({...order, status:next[order.status], badge:null});
  }

  const devScreens = [
    {id:"login", label:"Login"},
    {id:"kanban", label:"Kanban Desktop"},
    {id:"kanban_m", label:"Kanban Mobile"},
  ];

  return (
    <>
      {screen === "login" && <LoginScreen onLogin={() => setScreen("kanban")}/>}
      {screen === "kanban" && <KanbanDesktop orders={orders} setOrders={setOrders} onOpenDetail={setDetail}/>}
      {screen === "kanban_m" && <KanbanMobile orders={orders} setOrders={setOrders} onOpenDetail={setDetail}/>}

      {detail && <OrderDetail order={detail} onClose={()=>setDetail(null)} onAdvance={advanceOrder} onBell={()=>{}}/>}

      <div className="dev-nav">
        {devScreens.map(s => <button key={s.id} className={screen===s.id?"active":""} onClick={()=>setScreen(s.id)}>{s.label}</button>)}
      </div>

      <div className={`tweaks-panel ${showTweaks?"open":""}`}>
        <h3>Tweaks</h3>
        <div className="tweak-row">
          <label>Vista por defecto</label>
          <select value={tweaks.layout} onChange={e=>setTweaks({...tweaks, layout:e.target.value})}>
            <option value="desktop">Desktop / Tablet</option>
            <option value="mobile">Mobile</option>
          </select>
        </div>
        <div className="tweak-row">
          <label>Densidad de tarjetas</label>
          <select value={tweaks.cardDensity} onChange={e=>setTweaks({...tweaks,cardDensity:e.target.value})}>
            <option value="normal">Normal</option>
            <option value="compact">Compacta</option>
          </select>
        </div>
      </div>

      <template id="__bundler_thumbnail" data-bg-color="#0F0F0F">
        <svg viewBox="0 0 1024 768" xmlns="http://www.w3.org/2000/svg">
          <rect width="1024" height="768" fill="#0F0F0F"/>
          <rect x="20" y="60" width="320" height="400" rx="12" fill="#1E1E1E"/>
          <rect x="352" y="60" width="320" height="400" rx="12" fill="#1E1E1E"/>
          <rect x="684" y="60" width="320" height="400" rx="12" fill="#1E1E1E"/>
          <text x="180" y="280" textAnchor="middle" fontSize="48" fontFamily="monospace" fill="#F97316">#031</text>
          <text x="512" y="280" textAnchor="middle" fontSize="48" fontFamily="monospace" fill="#EAB308">#033</text>
          <text x="844" y="280" textAnchor="middle" fontSize="48" fontFamily="monospace" fill="#22C55E">#035</text>
        </svg>
      </template>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
